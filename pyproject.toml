[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-rail-planning"
version = "0.1.0"
description = "Robust Rail NL PDDL Planning"
requires-python = ">=3.9"
dependencies = [
    "unified-planning[enhsp]==1.3.0",
    "questionary",
    "protobuf<4.0",
    "setuptools<82",
]

[project.optional-dependencies]
# Only what the schema tests need. They import converter, which is stdlib-only,
# so this does not drag in the planner toolchain.
test = ["pytest", "jsonschema"]

[project.scripts]
robust-rail-plan = "robust_rail_planning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
