[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-rail-planning"
version = "0.1.0"
description = "Robust Rail NL PDDL Planning"
requires-python = ">=3.9"
dependencies = [
    "unified-planning[enhsp]==1.3.0",
    "questionary",
    "protobuf<4.0",
    "setuptools<82",
]

[project.scripts]
robust-rail-plan = "robust_rail_planning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]