[pytest]
# Restores what pyproject.toml's [tool.pytest.ini_options] provided before the
# move away from packaging. It matters more than it looks: CI clones
# robust-rail-generator and robust-rail-general *into* this workspace, so a
# bare `pytest` walks into the generator's suite and fails collecting tests that
# need pydantic and its own src/ on the path.
testpaths = tests
