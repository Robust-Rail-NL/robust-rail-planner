name: Schema

# edge is the fast/unvetted image channel (see CONTRIBUTING.md) — it only
# ever gains work via direct `git merge --no-ff`, never a GitHub PR targeting
# it, so it's only listed under push, not pull_request.
on:
  push:
    branches: [ "main", "edge" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    name: Plan schema conformance
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    # The schemas and the fixtures these tests read both live in
    # robust-rail-general. Taken from the branch of the same name when one
    # exists there, so a coordinated cross-repo schema change is validated
    # against its own schema rather than main's — falling back to main
    # otherwise, since most branches here have no counterpart over there.
    - name: Check out robust-rail-general
      run: |
        ref="${{ github.head_ref || github.ref_name }}"
        repo="https://github.com/Robust-Rail-NL/robust-rail-general"
        use="$ref"
        if ! git ls-remote --exit-code --heads "$repo" "$use" >/dev/null 2>&1; then
          use=main
        fi
        echo "Using robust-rail-general@$use"
        git clone --quiet --depth 1 --branch "$use" "$repo" robust-rail-general

    # Gating: validating against a schema that no longer matches its models
    # does not fail, it passes, having checked the wrong contract.
    - name: Check robust-rail-general's schemas are not stale
      working-directory: robust-rail-general
      run: |
        pipx install uv >/dev/null 2>&1 || pip install uv
        uv sync --frozen
        uv run --frozen python scripts/export_schema.py
        git diff --exit-code schema/ \
          || { echo "::error::robust-rail-general's schema/ is stale — re-export and commit it there"; exit 1; }

    - uses: docker/setup-buildx-action@v3

    # Built from this commit, never pulled from ghcr. A published image is built
    # from whatever commit was current when someone last ran docker-push.sh, so
    # testing against it would report on the previous release and call it a pass
    # — the same staleness trap as validating against a schema that no longer
    # matches its models.
    #
    # Cheap despite that: the Dockerfile puts app code in the last layer, so
    # everything above it (apt, the Julia tarball, ENHSP, Pkg.instantiate, pip)
    # comes from cache. ~2 min cold, seconds warm; the layer that changes per
    # push is under a megabyte.
    - name: Build the planner image from this commit
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: planner:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The whole point of running in the container: it is the only place the
    # Julia planner backend is instantiated. On the runner those 11 tests skip,
    # and they are the ones that would have caught the compiled_route_edge and
    # get_su_id regressions — both of which passed every host-side test while
    # producing plans that were empty or malformed.
    #
    # pip install at run time rather than baking test deps into the image: they
    # have no business in what gets published, and it costs a few seconds.
    - name: Test inside the image
      run: |
        docker run --rm \
          -e RRN_INPUTS_DIR=/siblings/robust-rail-general \
          -v "$PWD/robust-rail-general:/siblings/robust-rail-general:ro" \
          --entrypoint sh planner:ci -c '
            pip install --quiet --no-cache-dir -r requirements-test.txt jsonschema &&
            python3 -m pytest tests -q -rs
          '
