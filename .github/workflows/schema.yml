name: Schema

# release/2.0.0 is the shared integration branch across the five repos in this
# release; main is the stable one.
on:
  push:
    branches: [ "main", "release/2.0.0" ]
  pull_request:
    branches: [ "main", "release/2.0.0" ]
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    name: Plan schema conformance
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v5

    # The schemas live in the generator, and the fixtures these tests read live
    # in scenario-planning-inputs. Both are taken from the branch of the same
    # name, so a coordinated schema change is validated against its own schema
    # rather than the base branch's. That works because every repo in this
    # release shares one branch name — see roadmap "Branch naming".
    - name: Check out the sibling repos
      run: |
        ref="${{ github.head_ref || github.ref_name }}"
        for name in robust-rail-generator scenario-planning-inputs; do
          repo="https://github.com/Robust-Rail-NL/$name"
          use="$ref"
          if ! git ls-remote --exit-code --heads "$repo" "$use" >/dev/null 2>&1; then
            use=release/2.0.0
          fi
          echo "Using $name@$use"
          git clone --quiet --depth 1 --branch "$use" "$repo" "$name"
        done

    # Gating, and for the same reason as in scenario-planning-inputs: validating
    # against a schema that no longer matches its models does not fail, it
    # passes, having checked the wrong contract.
    - name: Check the generator's schemas are not stale
      working-directory: robust-rail-generator
      run: |
        pipx install uv >/dev/null 2>&1 || pip install uv
        uv sync --frozen
        uv run --frozen python scripts/export_schema.py
        git diff --exit-code schema/ \
          || { echo "::error::the generator's schema/ is stale — re-export and commit it there"; exit 1; }

    - uses: docker/setup-buildx-action@v3

    # Built from this commit, never pulled from ghcr. A published image is built
    # from whatever commit was current when someone last ran docker-push.sh, so
    # testing against it would report on the previous release and call it a pass
    # — the same staleness trap as validating against a schema that no longer
    # matches its models.
    #
    # Cheap despite that: the Dockerfile puts app code in the last layer, so
    # everything above it (apt, the Julia tarball, ENHSP, Pkg.instantiate, pip)
    # comes from cache. ~2 min cold, seconds warm; the layer that changes per
    # push is under a megabyte.
    - name: Build the planner image from this commit
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: planner:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # The whole point of running in the container: it is the only place the
    # Julia planner backend is instantiated. On the runner those 11 tests skip,
    # and they are the ones that would have caught the compiled_route_edge and
    # get_su_id regressions — both of which passed every host-side test while
    # producing plans that were empty or malformed.
    #
    # pip install at run time rather than baking test deps into the image: they
    # have no business in what gets published, and it costs a few seconds.
    - name: Test inside the image
      run: |
        docker run --rm \
          -e RRN_GENERATOR_DIR=/siblings/robust-rail-generator \
          -e RRN_INPUTS_DIR=/siblings/scenario-planning-inputs \
          -v "$PWD/robust-rail-generator:/siblings/robust-rail-generator:ro" \
          -v "$PWD/scenario-planning-inputs:/siblings/scenario-planning-inputs:ro" \
          --entrypoint sh planner:ci -c '
            pip install --quiet --no-cache-dir -r requirements-test.txt jsonschema &&
            python3 -m pytest tests -q -rs
          '
